<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Inter+Tight:wght@300;400;500&amp;display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #191919; color: #F5F5F5; font-family: Inter, Helvetica, Arial, sans-serif; font-feature-settings: "cv11", "ss01"; }
    * { box-sizing: border-box; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #FFFFFF; }
    .hatch { background-color: #202020; background-image: repeating-linear-gradient(135deg, #282828 0 10px, #202020 10px 20px); }
    .eq { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
    .eq i { display: block; width: 2px; height: 10px; background: #F5F5F5; transform-origin: bottom; animation: eqbar 1s ease-in-out infinite; }
    .eq i:nth-child(1) { animation-delay: -.1s; }
    .eq i:nth-child(2) { animation-delay: -.55s; }
    .eq i:nth-child(3) { animation-delay: -.3s; }
    @keyframes eqbar { 0%, 100% { transform: scaleY(.28); } 50% { transform: scaleY(1); } }
    .close { display: grid; place-items: center; width: 44px; height: 44px; margin: -12px -12px 0 0; border: 0; background: transparent; color: #6B6B6B; cursor: pointer; transition: color .25s; }
    .close:hover { color: #F5F5F5; }
    .open-link { display: inline-flex; align-items: center; gap: 8px; color: #EDEDED; border-bottom: 1px solid #3B3B3B; padding-bottom: 3px; transition: gap .35s cubic-bezier(.16,.84,.24,1), border-color .3s; }
    .open-link:hover { gap: 14px; border-color: #F5F5F5; }
    .scrub { position: relative; height: 2px; background: #262626; cursor: default; }
    .scrub-head { position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #F5F5F5; opacity: 0; transition: opacity .25s; }
    .scrub:hover .scrub-head { opacity: 1; }
  </style>
</helmet>

<div style="position: relative; min-height: 100vh; background: #191919; overflow: hidden;">

  <!-- pagina por baixo, esmaecida -->
  <div style="padding: 0 44px; filter: blur(2px); opacity: .38;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 22px 0 18px;">
      <span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 15px; font-weight: 500; letter-spacing: -0.02em;">Filipe Vieira</span>
      <div style="display: flex; gap: 34px; font-size: 13px; color: #9A9A9A;"><span>Trabalho</span><span>Sobre</span><span>Contato</span></div>
    </div>
    <h1 style="margin: 99px 0 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 95px; line-height: 0.9; letter-spacing: -0.05em; font-weight: 500;">
      Faço aplicativos<br />que cabem na mão
    </h1>
  </div>

  <!-- backdrop -->
  <div style="position: absolute; inset: 0; background: #191919; opacity: .88;"></div>

  <!-- painel -->
  <div style="position: absolute; inset: 0; display: grid; place-items: center; padding: 40px;">
    <div style="position: relative; width: 860px; border: 1px solid #262626; border-radius: 8px; background: #1D1D1D; padding: 40px;">

      <div style="display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; align-items: start;">

        <!-- capa, com o brilho que em producao usa a cor dominante da arte -->
        <div style="position: relative;">
          <div style="position: absolute; inset: -28px; border-radius: 50%; background: radial-gradient(55% 55% at 50% 45%, rgba(245, 245, 245, 0.07) 0%, rgba(245, 245, 245, 0) 72%); pointer-events: none;"></div>
          <div class="hatch" style="position: relative; width: 300px; height: 300px; border-radius: 4px; border: 1px solid #2C2C2C; display: grid; place-items: center;">
            <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B;">capa do álbum</span>
          </div>
        </div>

        <div style="min-width: 0;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
              <span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B;">Tocando agora</span>
            </div>
            <button type="button" class="close" aria-label="Fechar">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
                <path d="M2 2 L12 12 M12 2 L2 12" />
              </svg>
            </button>
          </div>

          <h2 style="margin: 20px 0 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 42px; line-height: 1.06; letter-spacing: -0.034em; font-weight: 500; color: #F5F5F5; text-wrap: balance;">Chamber of Reflection</h2>
          <div style="margin-top: 12px; font-size: 17px; color: #A3A3A3;">Mac DeMarco</div>
          <div style="margin-top: 6px; font-size: 13px; color: #6B6B6B;">Salad Days · 2014</div>

          <div style="margin-top: 34px;">
            <div class="scrub">
              <div style="height: 2px; background: #F5F5F5; width: {{ pct }};"></div>
              <div class="scrub-head" style="left: {{ pct }}; margin-left: -4px;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 9px; font-size: 12px; letter-spacing: 0.04em; color: #565656; font-variant-numeric: tabular-nums;">
              <span>{{ elapsedText }}</span>
              <span>{{ durationText }}</span>
            </div>
          </div>

          <div style="margin-top: 30px; padding-top: 22px; border-top: 1px solid #262626; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px 24px;">
            <div>
              <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B6B;">Dispositivo</div>
              <div style="margin-top: 5px; font-size: 14px; color: #D6D6D6;">iPhone de Filipe</div>
            </div>
            <a href="#" class="open-link" style="font-size: 15px;">
              Abrir no Spotify
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9 L9 4 M5 4 H9 V8" />
              </svg>
            </a>
          </div>
        </div>
      </div>

      <div style="margin-top: 30px; padding-top: 18px; border-top: 1px solid #242424; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4B4B4B;">
        <span>Dados do Spotify Web API</span>
        <span style="color: #3B3B3B;">·</span>
        <span>atualiza a cada 5 s</span>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { elapsed: 0 };

  componentDidMount() {
    this._start = Date.now();
    this._id = setInterval(() => this.setState({ elapsed: Date.now() - this._start }), 250);
  }

  componentWillUnmount() {
    clearInterval(this._id);
  }

  renderVals() {
    const duration = 214000;
    const progress = (61000 + this.state.elapsed) % duration;
    const fmt = (ms) => {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return m + ':' + (s < 10 ? '0' + s : String(s));
    };
    return {
      pct: ((progress / duration) * 100).toFixed(2) + '%',
      elapsedText: fmt(progress),
      durationText: fmt(duration)
    };
  }
}
</script>
</body>
</html>
